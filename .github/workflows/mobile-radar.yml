name: Mobile independent live radar and surface phase
on:
  workflow_dispatch:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  push:
    branches: [main]
    paths: ['scripts/ingest-radar-phase.py','scripts/ingest-radar-points.py','scripts/ingest-opera-radar.py','scripts/ingest-swiss-radar.py','assets/app.js','assets/national-warnings.js','.github/workflows/mobile-radar.yml']
permissions:
  contents: write
jobs:
  radar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: phase
            script: ingest-radar-phase.py
            file: radar-phase.json.gz
          - kind: ry
            script: ingest-radar-points.py
            file: radar-points.json.gz
          - kind: opera
            script: ingest-opera-radar.py
            file: opera-radar.json.gz
          - kind: swiss
            script: ingest-swiss-radar.py
            file: swiss-radar.json.gz
    concurrency:
      group: mobile-radar-${{ matrix.kind }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install h5py numpy pyproj
      - run: mkdir -p data && python scripts/${{ matrix.script }}
      - name: Validate packet and check Oberstdorf
        env:
          PACKET: data/${{ matrix.file }}
        run: |
          python - <<'PY'
          import base64, datetime, gzip, json, os, struct
          with gzip.open(os.environ['PACKET'],'rt') as f: d=json.load(f)
          g=d['grid']; t=datetime.datetime.fromisoformat(d['time'])
          age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()
          max_age = 2100 if d.get('product') == 'OPERA-RATE' else 1200
          assert 0 <= age <= max_age, (d.get('product'), t, age, max_age)
          n=g['ny']*g['nx']; i=round((47.4084-g['south'])/g['step'])*g['nx']+round((10.2761-g['west'])/g['step'])
          if 'classes' in d:
              raw=base64.b64decode(d['classes']); assert len(raw)==n
              print('Oberstdorf surface phase',raw[i], 'scan',d['time'])
          else:
              raw=base64.b64decode(d['amount']); assert len(raw)==n*2
              print('Oberstdorf raw radar',struct.unpack_from('<h',raw,i*2)[0], 'scan',d['time'])
          PY
      - name: Verify independent surface evidence in Oberstdorf
        if: matrix.kind == 'phase'
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt, json, urllib.parse, urllib.request
          now=dt.datetime.now(dt.timezone.utc)
          query=urllib.parse.urlencode(dict(lat=47.4084,lon=10.2761,max_dist=2000,date=(now-dt.timedelta(minutes=65)).isoformat(),last_date=now.isoformat()))
          req=urllib.request.Request('https://api.brightsky.dev/weather?'+query,headers={'Origin':'null','User-Agent':'WetterApp/1.0'})
          with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
              print('Ground observation CORS:',response.headers.get('Access-Control-Allow-Origin'))
          for row in data.get('weather',[]):
              source_id=row.get('fallback_source_ids',{}).get('condition',row.get('source_id'))
              source=next((s for s in data.get('sources',[]) if s['id']==source_id),{})
              print('Oberstdorf ground evidence:',row.get('timestamp'),row.get('condition'),source.get('station_name'),source.get('observation_type'),source.get('height'))
          PY
      - name: Publish independent validated snapshot
        env:
          PACKET: ${{ matrix.file }}
          KIND: ${{ matrix.kind }}
        run: |
          git config user.name 'Wetter Mobile Data'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ref="refs/heads/mobile-radar-$KIND"
          subject="Generated mobile radar $KIND snapshot"
          previous=$(git ls-remote --heads origin "$ref" | cut -f1)
          if test -n "$previous"; then
            git fetch --depth=1 origin "$previous"
            test "$(git ls-tree -r --name-only "$previous")" = "$PACKET"
            test "$(git log -1 --format=%s "$previous")" = "$subject"
          fi
          blob=$(git hash-object -w "data/$PACKET")
          if test -n "$previous" && test "$(git rev-parse "$previous:$PACKET")" = "$blob"; then exit 0; fi
          tree=$(printf '100644 blob %s\t%s\n' "$blob" "$PACKET" | git mktree)
          commit=$(git commit-tree "$tree" -m "$subject")
          git push --force-with-lease="$ref:$previous" origin "$commit:$ref"
