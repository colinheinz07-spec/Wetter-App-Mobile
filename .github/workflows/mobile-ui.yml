name: Mobile weather app quality checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-mobile.cjs'
      - 'scripts/check-mobile-browser.cjs'
      - 'scripts/test-data-performance*.cjs'
      - 'scripts/test-live-observations.cjs'
      - 'scripts/test-live-fog-weather.cjs'
      - 'scripts/test-today-extremes.cjs'
      - 'scripts/test-cloudflare-updater.mjs'
      - 'cloudflare/**'
      - 'scripts/test-observations.cjs'
      - 'scripts/test-observations-browser.cjs'
      - 'scripts/test-radar-phase.cjs'
      - 'scripts/test-forecast-period-details.cjs'
      - '.github/workflows/mobile-ui.yml'
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-mobile.cjs
      - run: node scripts/test-cloudflare-updater.mjs
      - run: node scripts/test-data-performance-unit.cjs
      - run: node scripts/test-live-observations.cjs
      - run: node scripts/test-live-fog-weather.cjs
      - run: node scripts/test-today-extremes.cjs
      - run: node scripts/test-observations.cjs
      - run: node scripts/test-radar-phase.cjs
      - run: node scripts/test-forecast-period-details.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test actual app in mobile browser
        run: node scripts/check-mobile-browser.cjs
      - name: Test observation data and current frost on iPad layout
        run: node scripts/test-observations-browser.cjs
      - name: Test storm tracking and live warning lifecycle
        run: node scripts/test-storm-browser.cjs
      - name: Test model and radar availability, caching and explanations
        run: node scripts/test-data-performance.cjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-previews
          path: ui-*.png
          if-no-files-found: ignore
          retention-days: 3

