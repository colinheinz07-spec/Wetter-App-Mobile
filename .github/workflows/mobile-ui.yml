name: Mobile weather app quality checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/check-mobile.cjs'
      - 'scripts/check-mobile-browser.cjs'
      - '.github/workflows/mobile-ui.yml'
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-mobile.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test actual app in mobile browser
        run: node scripts/check-mobile-browser.cjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-previews
          path: ui-*.png
          if-no-files-found: ignore
          retention-days: 3
